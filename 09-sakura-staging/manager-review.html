<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>店長確認表｜菜の花村 お買い物ページ試作</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body class="manager-review-page">
  <a class="skip-link" href="#main">確認項目へ移動</a>
  <div class="prototype-ribbon">店長確認用の試作です。実際の注文・ログイン・送信は行いません。</div>
  <header class="site-header">
    <div class="header-main">
      <a class="home-link" href="index.html">試作トップへ</a>
      <a class="brand" href="index.html"><strong>菜の花村</strong><small>お買い物ページ</small></a>
      <span aria-hidden="true"></span>
    </div>
  </header>
  <main id="main" class="manager-review-shell" tabindex="-1">
    <header class="manager-review-heading">
      <p class="eyebrow">店長確認用</p>
      <h1>店長確認表</h1>
      <p>実際の買い物と同じ順に操作し、気になる項目を確認してください。</p>
      <p class="review-save-note">チェック状態は保存・送信されません。</p>
    </header>

    <ol class="review-list">
      <li class="review-item"><label><input type="checkbox"><span><strong>商品の探しやすさ</strong><small>検索、カテゴリー、商品詳細まで迷わず進めるか。</small></span></label></li>
      <li class="review-item"><label><input type="checkbox"><span><strong>商品情報と画像</strong><small>商品名、規格、価格、商品コード、画像、掲載状態が正しいか。</small></span></label></li>
      <li class="review-item"><label><input type="checkbox"><span><strong>カート操作</strong><small>追加、数量変更、削除、合計、買い物継続が分かりやすいか。</small></span></label></li>
      <li class="review-item"><label><input type="checkbox"><span><strong>一般発送と定期配達の入口</strong><small>利用者が自分に合う入口を選べるか。</small></span></label></li>
      <li class="review-item is-pending"><label><input type="checkbox"><span><strong>Web会員登録・Web会員CD・ログインの扱い</strong><small>登録する人、会員CDの案内、ログイン後の判定方法を確認する。</small><em>店長確認が必要</em></span></label></li>
      <li class="review-item is-pending"><label><input type="checkbox"><span><strong>一般発送のお届け区分コード・設定値</strong><small>正式なコード・設定値は未確認です。</small><em>店長確認が必要</em></span></label></li>
      <li class="review-item is-pending"><label><input type="checkbox"><span><strong>支払い方法</strong><small>試作に必要な選択肢と案内を確認する。</small><em>店長確認が必要</em></span></label></li>
      <li class="review-item is-pending"><label><input type="checkbox"><span><strong>送料</strong><small>表示する時点、金額、例外の案内を確認する。</small><em>店長確認が必要</em></span></label></li>
      <li class="review-item is-pending"><label><input type="checkbox"><span><strong>配送先</strong><small>注文者と別の配送先を指定する流れを確認する。</small><em>店長確認が必要</em></span></label></li>
      <li class="review-item is-pending"><label><input type="checkbox"><span><strong>次回配達</strong><small>定期配達のお客様への表示と確定方法を確認する。</small><em>店長確認が必要</em></span></label></li>
      <li class="review-item is-pending"><label><input type="checkbox"><span><strong>店舗側に必要な情報</strong><small>注文確認に必要な項目と、店舗で行う作業を確認する。</small><em>店長確認が必要</em></span></label></li>
      <li class="review-item is-pending"><label><input type="checkbox"><span><strong>仮運用へ進めるか</strong><small>直す箇所と、実際の運用確認を始める条件を決める。</small><em>店長確認が必要</em></span></label></li>
    </ol>

    <a class="review-back-link" href="index.html">試作トップへ戻る</a>
  </main>
</body>
</html>
